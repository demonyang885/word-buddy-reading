<!doctype html>
<html lang="zh-Hant-HK">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#fffaf1" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <title>中文字星球 · 兒童認字</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body class="chinese-course">
    <div class="page-shell">
      <header class="topbar">
        <a class="brand" href="#" aria-label="回到認讀模式">
          <span class="brand-mark" aria-hidden="true">字</span>
          <span>
            <strong>中文字星球</strong>
            <small>Hanzi Buddy</small>
          </span>
        </a>

        <div class="header-actions">
          <a class="course-switch" href="index.html">英文認詞</a>
          <span class="sync-status" id="syncStatus" aria-live="polite">正在讀取進度</span>
          <div class="day-score" aria-label="今天的練習數量">
            <span>今天</span>
            <strong id="todayCount">0</strong>
          </div>
          <button class="record-button" id="recordButton" type="button">學習檔案</button>
          <button class="icon-button" id="settingsButton" type="button" aria-label="開啟聲音設定">
            <span aria-hidden="true">Aa</span>
          </button>
        </div>
      </header>

      <main>
        <section class="welcome-row" aria-labelledby="pageTitle">
          <div>
            <p class="eyebrow">每天十分鐘 · 大聲讀出來</p>
            <h1 id="pageTitle">今天想怎樣認字？</h1>
          </div>
          <div class="word-count-badge">
            <strong id="wordCount">0</strong>
            <span>個字詞</span>
          </div>
        </section>

        <section class="section-bar" aria-label="選擇學習範圍">
          <label for="sectionSelect">
            <span><strong>學習範圍</strong><small>可按教材頁次練習</small></span>
            <select id="sectionSelect">
              <option value="all">全部範圍</option>
            </select>
          </label>
        </section>

        <nav class="mode-tabs" aria-label="學習模式">
          <button class="mode-tab is-active" type="button" data-mode="learn" aria-pressed="true">
            <span class="tab-number">01</span>
            <span><strong>認讀</strong><small>看一看，讀一讀</small></span>
          </button>
          <button class="mode-tab" type="button" data-mode="challenge" aria-pressed="false">
            <span class="tab-number">02</span>
            <span><strong>挑戰</strong><small>看字詞，獨立讀</small></span>
          </button>
          <button class="mode-tab" type="button" data-mode="review" aria-pressed="false">
            <span class="tab-number">03</span>
            <span><strong>鞏固</strong><small>錯誤字詞再練兩遍</small></span>
            <span class="mistake-badge" id="mistakeBadge" hidden>0</span>
          </button>
        </nav>

        <section class="learning-panel" id="learningPanel" aria-live="polite"></section>

        <section class="progress-card" aria-label="學習記錄">
          <div class="progress-heading">
            <div>
              <p class="eyebrow">我的足跡</p>
              <h2>真正讀出來，才算會</h2>
            </div>
            <div class="progress-actions">
              <button class="text-button" id="openRecordsButton" type="button">查看全部字詞</button>
              <button class="text-button danger" id="clearMistakesButton" type="button">清空待鞏固項目</button>
            </div>
          </div>
          <div class="stats-grid">
            <div class="stat-item">
              <strong id="masteredStat">0</strong>
              <span>已經會讀</span>
            </div>
            <div class="stat-item">
              <strong id="answerStat">0</strong>
              <span>開口嘗試</span>
            </div>
            <div class="stat-item accent">
              <strong id="accuracyStat">—</strong>
              <span>認讀正確率</span>
            </div>
            <div class="stat-item warm">
              <strong id="mistakeStat">0</strong>
              <span>待鞏固</span>
            </div>
          </div>
          <div class="mistake-strip" id="mistakeStrip"></div>
        </section>

        <p class="source-note" id="sourceNote"></p>
      </main>
    </div>

    <div class="settings-backdrop" id="settingsBackdrop" hidden>
      <section class="settings-sheet" role="dialog" aria-modal="true" aria-labelledby="settingsTitle">
        <div class="sheet-handle" aria-hidden="true"></div>
        <div class="sheet-heading">
          <div>
            <p class="eyebrow">聲音設定</p>
            <h2 id="settingsTitle">選擇孩子使用的讀音</h2>
          </div>
          <button class="close-button" id="closeSettingsButton" type="button" aria-label="關閉設定">完成</button>
        </div>

        <label class="setting-block" for="speechLangSelect">
          <span><strong>認讀語言</strong></span>
          <select id="speechLangSelect">
            <option value="zh-HK">粵語（香港）</option>
            <option value="zh-TW">普通話（繁體）</option>
          </select>
        </label>

        <label class="setting-row">
          <span><strong>鞏固自動播讀</strong><small>切換待鞏固字詞後自動朗讀</small></span>
          <input id="autoSpeakInput" type="checkbox" role="switch" checked />
        </label>

        <label class="setting-block" for="rateInput">
          <span><strong>朗讀速度</strong><output id="rateOutput">舒緩</output></span>
          <input id="rateInput" type="range" min="0.6" max="1.1" step="0.1" value="0.8" />
          <span class="range-labels"><small>慢一點</small><small>快一點</small></span>
        </label>

        <label class="setting-block" for="voiceSelect">
          <span><strong>朗讀聲音</strong></span>
          <select id="voiceSelect">
            <option value="">裝置預設聲音</option>
          </select>
        </label>

        <button class="primary-button wide" id="testVoiceButton" type="button">試聽：大家好！</button>
      </section>
    </div>

    <div class="records-backdrop" id="recordsBackdrop" hidden>
      <section class="records-sheet" role="dialog" aria-modal="true" aria-labelledby="recordsTitle">
        <div class="sheet-handle" aria-hidden="true"></div>
        <div class="sheet-heading records-heading">
          <div>
            <p class="eyebrow">逐項儲存 · 隨時續學</p>
            <h2 id="recordsTitle">中文認字學習檔案</h2>
          </div>
          <button class="close-button" id="closeRecordsButton" type="button" aria-label="關閉學習檔案">完成</button>
        </div>
        <div class="record-filters" role="group" aria-label="篩選學習記錄">
          <button type="button" class="record-filter is-active" data-record-filter="all">全部</button>
          <button type="button" class="record-filter" data-record-filter="mastered">已會讀</button>
          <button type="button" class="record-filter" data-record-filter="learning">練習中</button>
          <button type="button" class="record-filter" data-record-filter="new">未開始</button>
        </div>
        <div class="record-summary" id="recordSummary"></div>
        <div class="record-tools">
          <button type="button" id="exportRecordsButton">匯出學習檔案</button>
          <label>
            恢復學習檔案
            <input type="file" id="importRecordsInput" accept="application/json,.json" />
          </label>
        </div>
        <div class="record-list" id="recordList"></div>
      </section>
    </div>

    <div class="toast" id="toast" role="status" aria-live="polite" hidden></div>

    <script src="chinese-words.js"></script>
    <script src="app.js"></script>
  </body>
</html>
