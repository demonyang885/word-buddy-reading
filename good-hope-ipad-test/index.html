function normaliseReading(text){const map={'裏':'裡','园':'園','们':'們','鸟':'鳥','蓝':'藍','飞':'飛','学':'學','课':'課','时':'時','会':'會','伞':'傘','铅':'鉛','愿':'願','画':'畫','鲜':'鮮','书':'書','图':'圖','馆':'館','虽':'雖','还':'還','爱':'愛','师':'師','礼':'禮','场':'場'};return[...String(text||'').toLowerCase().replace(/[，。！？、,.!?\s]/g,'')].map(x=>map[x]||x).join('')}
function editDistance(a,b){const x=[...a],y=[...b],row=Array(y.length+1).fill(0).map((_,i)=>i);for(let i=1;i<=x.length;i++){let prev=row[0];row[0]=i;for(let j=1;j<=y.length;j++){const old=row[j];row[j]=Math.min(row[j]+1,row[j-1]+1,prev+(x[i-1]===y[j-1]?0:1));prev=old}}return row[y.length]}

  if('speechSynthesis'in window)speechSynthesis.cancel();
  const technical=ans.filter(x=>x==='tech').length,graded=Q.length-technical,score=ans.reduce((n,x,i)=>n+(x===Q[i].a),0),pct=graded?Math.round(score/graded*100):0;
  let h=history();h.unshift({d:new Date().toLocaleString('zh-HK',{hour12:false}),score,total:graded});localStorage.setItem('gh-attempts-v2',JSON.stringify(h.slice(0,5)));
  const cg=GROUPS.map(g=>{const ii=Q.map((q,i)=>q.g===g?i:-1).filter(i=>i>=0&&ans[i]!=='tech'),ok=ii.filter(i=>ans[i]===Q[i].a).length,total=ii.length;return`<div><span>${g}</span><strong>${ok}/${total}</strong><div class="minibar"><i style="width:${total?ok/total*100:0}%"></i></div></div>`}).join('');
  const reviews=Q.map((q,i)=>{const tech=ans[i]==='tech',ok=ans[i]===q.a;const detail=q.r?`<p>朗讀句子：${esc(q.p)}</p><p>系統聽到：${esc(heard[i]||'未有紀錄')}</p>`:`<p>${esc(q.n)}</p><p>正確答案：${esc(q.o[q.a])}</p>${!ok&&ans[i]!==null?`<p>作答：${esc(q.o[ans[i]]||'未作答')}</p>`:''}`;const label=tech?'技術未完成':q.r?(ok?'朗讀正確':'需要重讀'):(ok?'正確':ans[i]===null?'超時':'需重溫');return`<details class="${ok||tech?'':'wrong'}"><summary><span>第${i+1}題 · ${q.g} · 難度${q.d}</span><b>${label}</b></summary>${detail}</details>`}).join('');
  app.innerHTML=`<section class="shell"><div class="card"><p class="eyebrow">2025 iPad專項完成</p><h1>${esc(name)} 的成績</h1><div class="score" style="--score:${pct*3.6}deg"><div><strong>${score}</strong><span>/ ${graded}</span></div></div><p class="message">${technical?`${technical}題因語音技術問題未計分。`:''}${pct>=85?'整體表現穩定，可以改用正常面試速度。':pct>=65?'基礎良好，建議集中重做失分範疇。':'先使用清晰慢速，理解指令後再練限時。'}</p><div class="catgrid">${cg}</div><div class="review"><h2>答題檢視</h2>${reviews}</div><div class="actions"><button class="primary" id="again">換一套題</button><button class="secondary" id="home">返回首頁</button></div></div></section>`;
  document.getElementById('again').onclick=()=>{Q=buildSet();at=0;ans=[];heard=[];showQ()};
  document.getElementById('home').onclick=welcome;
}

if('speechSynthesis'in window){speechSynthesis.getVoices();speechSynthesis.onvoiceschanged=()=>speechSynthesis.getVoices()}
welcome();
  </script>
</body>
</html>
