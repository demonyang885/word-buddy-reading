,{id:'l11',c:'邏輯',d:1,i:'找出圖形規律',p:'⭐　⚪　⭐　⚪　？',o:['⭐','🔺','⬛','◆'],a:0,s:60,n:'圖形規律'}

const app=document.getElementById('app');
const CATS=['中文','英文','數學','邏輯'];
let name='Evelyn',Q=[],at=0,left=0,ans=[],heard=[],locked=false,timer=null,audioPlayed=false,audioToken=0,speed=localStorage.getItem('gh-speed')||'clear',activeRecognition=null,readStopTimer=null;
const esc=s=>String(s).replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
const shuffle=a=>{const b=[...a];for(let i=b.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[b[i],b[j]]=[b[j],b[i]]}return b};
function buildSet(){const picked=[];picked.push(shuffle(BANK.filter(q=>q.c==='中文'&&q.v))[0]);picked.push(shuffle(BANK.filter(q=>q.c==='中文'&&q.r))[0]);picked.push(shuffle(BANK.filter(q=>q.c==='中文'&&!q.v&&!q.r))[0]);['英文','數學','邏輯'].forEach(c=>[1,2,3].forEach(d=>{const pool=BANK.filter(q=>q.c===c&&q.d===d);picked.push(pool[Math.floor(Math.random()*pool.length)])}));return shuffle(picked)}
function voiceFor(lang){if(!('speechSynthesis'in window))return null;const vs=speechSynthesis.getVoices();const score=v=>{const l=v.lang.toLowerCase(),n=v.name.toLowerCase();let s=0;if(lang==='zh-HK'){if(l==='zh-hk'||l==='yue-hk')s+=100;if(l.startsWith('zh'))s+=30;if(/sin-ji|cantonese|hong kong|siri/.test(n))s+=25}else{if(l==='en-gb')s+=100;if(l.startsWith('en'))s+=30;if(/daniel|serena|kate|siri|british/.test(n))s+=20}if(v.localService)s+=5;return s};return [...vs].sort((a,b)=>score(b)-score(a))[0]||null}
function utter(text,lang,onend){if(!('speechSynthesis'in window)){onend&&onend();return}speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(text);u.lang=lang;u.rate=speed==='clear'?(lang.startsWith('en')?.72:.66):(lang.startsWith('en')?.86:.8);u.pitch=.98;u.volume=1;const v=voiceFor(lang);if(v)u.voice=v;u.onend=onend;u.onerror=onend;speechSynthesis.speak(u)}
function history(){try{return JSON.parse(localStorage.getItem('gh-attempts-v2')||'[]')}catch(e){return[]}}
function sample(lang){const b=document.getElementById(lang==='zh-HK'?'zhSample':'enSample');if(b){b.textContent='播放中…';b.disabled=true}utter(lang==='zh-HK'?'請留心聆聽，選出老師讀出的答案。':'Listen carefully and choose the correct answer.',lang,()=>{if(b){b.textContent=lang==='zh-HK'?'🔊 中文試聽':'🔊 English test';b.disabled=false}})}
function welcome(){
  audioToken++;clearInterval(timer);stopReading();
  if('speechSynthesis'in window)speechSynthesis.cancel();
  const h=history();
  app.innerHTML=`<section class="shell welcome"><div class="card"><div class="mark">GH</div><p class="eyebrow">2026 · P1 INTERVIEW PRACTICE</p><h1>德望 iPad 模擬測試</h1><p class="intro">根據歷年題型建立72題分級題庫，每次均衡抽取12題，並保證包含中文聆聽及句子朗讀。每題限時60秒；語音播放和朗讀期間不計時。</p><label class="name"><span>小朋友姓名</span><input id="name" value="${esc(name)}" autocomplete="off"></label><label class="setting"><span>語音速度</span><select id="speed"><option value="clear" ${speed==='clear'?'selected':''}>清晰慢速（建議先使用）</option><option value="normal" ${speed==='normal'?'selected':''}>正常面試速度</option></select></label><div class="voice-tests"><button id="zhSample">🔊 中文試聽</button><button id="enSample">🔊 English test</button></div><div class="facts"><div><strong>72</strong><span>分級題庫</span></div><div><strong>60秒</strong><span>每題限時</span></div><div><strong>自動</strong><span>朗讀評分</span></div></div><button class="primary" id="start">開始模擬測試</button><p class="privacy">首次朗讀時請允許Safari使用咪高峰；系統會直接判定朗讀結果，紀錄只保存在這部iPad。</p>${h.length?`<div class="history"><div class="history-head"><h2>最近紀錄</h2><button id="clear">清除</button></div>${h.slice(0,3).map(x=>`<div class="history-row"><span>${esc(x.d)}</span><strong>${x.score}/12</strong></div>`).join('')}</div>`:''}</div></section>`;
  document.getElementById('speed').onchange=e=>{speed=e.target.value;localStorage.setItem('gh-speed',speed)};
  document.getElementById('zhSample').onclick=()=>sample('zh-HK');
  document.getElementById('enSample').onclick=()=>sample('en-GB');
  document.getElementById('start').onclick=()=>{name=document.getElementById('name').value.trim()||'小朋友';speed=document.getElementById('speed').value;localStorage.setItem('gh-speed',speed);Q=buildSet();at=0;ans=[];heard=[];showQ()};
  if(h.length)document.getElementById('clear').onclick=()=>{localStorage.removeItem('gh-attempts-v2');welcome()};
}
function startTimer(){clearInterval(timer);const t=document.getElementById('timer');if(!t)return;t.classList.remove('wait');t.innerHTML=`◷ <span>${left}</span>`;timer=setInterval(()=>{left--;const s=document.querySelector('#timer span');if(s)s.textContent=left;if(left<=7)t.classList.add('urgent');if(left<=0){clearInterval(timer);choose(null)}},1000)}
function playQuestion(){if(locked)return;const q=Q[at],button=document.getElementById('audio'),token=++audioToken;clearInterval(timer);button.disabled=true;button.classList.add('playing');button.textContent='🔊 播放中…';document.getElementById('timer').className='timer wait';document.getElementById('timer').textContent='播放時暫停計時';utter(q.v[0],q.v[1],()=>{if(token!==audioToken)return;audioPlayed=true;button.disabled=false;button.classList.remove('playing');button.textContent='🔊 再播放一次';document.querySelectorAll('.choices button').forEach(b=>b.disabled=false);document.getElementById('skip').disabled=false;startTimer()})}
function stopReading(){
  clearTimeout(readStopTimer);
  if(activeRecognition){try{activeRecognition.abort()}catch(e){}activeRecognition=null}
}
function normaliseReading(text){return String(text||'').toLowerCase().replace(/裏/g,'裡').replace(/[，。！？、,.!?\s]/g,'')}
function editDistance(a,b){const x=[...a],y=[...b],row=Array(y.length+1).fill(0).map((_,i)=>i);for(let i=1;i<=x.length;i++){let prev=row[0];row[0]=i;for(let j=1;j<=y.length;j++){const old=row[j];row[j]=Math.min(row[j]+1,row[j-1]+1,prev+(x[i-1]===y[j-1]?0:1));prev=old}}return row[y.length]}
function readingScore(spoken,target){const a=normaliseReading(spoken),b=normaliseReading(target);if(!a||!b)return 0;return 1-editDistance(a,b)/Math.max(a.length,b.length)}
function finishReading(passed,transcript,score=0){
  if(locked)return;
  const mic=document.getElementById('mic'),status=document.getElementById('readStatus'),heardBox=document.getElementById('heardText');
  if(mic){mic.classList.remove('listening');mic.disabled=true;mic.textContent=passed?'✓ 朗讀正確':'✕ 需要重讀'}
  if(status){status.className=`read-status ${passed?'ok':'bad'}`;status.textContent=passed?`系統判定：正確（${Math.round(score*100)}%）`:`系統判定：需重讀（${Math.round(score*100)}%）`}
  if(heardBox)heardBox.textContent=`系統聽到：${transcript||'未能辨識'}`;
  clearTimeout(readStopTimer);activeRecognition=null;
  setTimeout(()=>choose(passed?1:0,transcript||'未能辨識'),1200);
}
function startReading(){
  if(locked)return;
  const Recognition=window.SpeechRecognition||window.webkitSpeechRecognition;
  if(!Recognition){finishReading(false,'此瀏覽器不支援語音辨識',0);return}
  stopReading();
  const q=Q[at],mic=document.getElementById('mic'),status=document.getElementById('readStatus'),heardBox=document.getElementById('heardText');
  const recognition=new Recognition();activeRecognition=recognition;
  let captured=false,finished=false;
  recognition.lang='zh-HK';recognition.continuous=false;recognition.interimResults=false;recognition.maxAlternatives=5;
  recognition.onstart=()=>{mic.disabled=true;mic.classList.add('listening');mic.textContent='● 正在聆聽…';status.className='read-status';status.textContent='請由頭至尾清楚朗讀句子';heardBox.textContent='';document.getElementById('timer').textContent='朗讀時不計時'};
  recognition.onresult=event=>{captured=true;finished=true;const alternatives=Array.from(event.results[0]).map(x=>x.transcript);const best=alternatives.sort((a,b)=>readingScore(b,q.p)-readingScore(a,q.p))[0]||'';const score=readingScore(best,q.p);finishReading(score>=.72,best,score)};
  recognition.onerror=()=>{if(!captured&&!finished){finished=true;finishReading(false,'未能辨識',0)}};
  recognition.onend=()=>{clearTimeout(readStopTimer);activeRecognition=null;if(!captured&&!finished&&!locked){finished=true;finishReading(false,'沒有聽到完整句子',0)}};
  try{recognition.start();readStopTimer=setTimeout(()=>{try{recognition.stop()}catch(e){}},15000)}catch(e){finishReading(false,'咪高峰未能啟動',0)}
}
function showQ(){
  audioToken++;clearInterval(timer);stopReading();
  if('speechSynthesis'in window)speechSynthesis.cancel();
  locked=false;audioPlayed=false;
  const q=Q[at];left=60;
  const long=!q.r&&q.o.some(x=>x.length>18);
  const response=q.r
    ? `<div class="reading-card"><button class="mic" id="mic">🎙️ 開始朗讀</button><p class="read-status" id="readStatus">按下後，看到紅點才開始讀；系統會自動評分</p><p class="heard-text" id="heardText"></p></div>`
    : `${q.v?'<button class="audio" id="audio">🔊 播放題目</button><p class="audio-note">播放期間不計時；聽完後才可選擇答案</p>':''}<div class="choices ${long?'long':''}">${q.o.map((x,i)=>`<button data-i="${i}" ${q.v?'disabled':''}><span class="letter">${String.fromCharCode(65+i)}</span><span>${esc(x)}</span></button>`).join('')}</div>`;
  const waiting=q.v||q.r;
  app.innerHTML=`<section class="quiz"><header class="qhead"><div class="qcount">第 ${at+1} / ${Q.length} 題</div><div class="timer ${waiting?'wait':''}" id="timer">${q.r?'等待朗讀':q.v?'等待播放':`◷ <span>${left}</span>`}</div></header><div class="track"><i style="width:${(at+1)/Q.length*100}%"></i></div><div class="panel"><div><span class="pill">${q.c}</span><span class="pill level">難度 ${q.d}</span></div><p class="instruction">${esc(q.i)}</p><h1>${esc(q.p)}</h1>${response}</div><footer class="qfoot"><span>${q.r?'首次使用請允許Safari使用咪高峰；系統自動評分':q.v?'播放完畢後開始60秒計時':'每題限時60秒'}</span>${q.r?'':'<button id="skip" '+(q.v?'disabled':'')+'>跳過此題</button>'}</footer></section>`;
  document.querySelectorAll('.choices button').forEach(b=>b.onclick=()=>choose(Number(b.dataset.i)));
  const skip=document.getElementById('skip');if(skip)skip.onclick=()=>choose(null);
  if(q.r)document.getElementById('mic').onclick=startReading;
  else if(q.v)document.getElementById('audio').onclick=playQuestion;
  else startTimer();
}
function choose(v,heardText=null){
  if(locked||Q[at].v&&!audioPlayed)return;
  locked=true;audioToken++;clearInterval(timer);stopReading();
  if('speechSynthesis'in window)speechSynthesis.cancel();
  ans.push(v);heard.push(heardText);
  document.querySelectorAll('button').forEach(b=>b.disabled=true);
  setTimeout(()=>{if(at===Q.length-1)result();else{at++;showQ()}},v===null?120:380);
}
function result(){
  audioToken++;clearInterval(timer);stopReading();
  if('speechSynthesis'in window)speechSynthesis.cancel();
  const score=ans.reduce((n,x,i)=>n+(x===Q[i].a),0),pct=Math.round(score/Q.length*100);
  let h=history();h.unshift({d:new Date().toLocaleString('zh-HK',{hour12:false}),score});localStorage.setItem('gh-attempts-v2',JSON.stringify(h.slice(0,5)));
  const cg=CATS.map(c=>{const ii=Q.map((q,i)=>q.c===c?i:-1).filter(i=>i>=0),ok=ii.filter(i=>ans[i]===Q[i].a).length;return`<div><span>${c}</span><strong>${ok}/${ii.length}</strong><div class="minibar"><i style="width:${ok/ii.length*100}%"></i></div></div>`}).join('');
  const reviews=Q.map((q,i)=>{const ok=ans[i]===q.a;const detail=q.r?`<p>朗讀句子：${esc(q.p)}</p><p>系統聽到：${esc(heard[i]||'未有紀錄')}</p>`:`<p>${esc(q.n)}</p><p>正確答案：${esc(q.o[q.a])}</p>${!ok&&ans[i]!==null?`<p>作答：${esc(q.o[ans[i]])}</p>`:''}`;return`<details class="${ok?'':'wrong'}"><summary><span>第${i+1}題 · ${q.c} · 難度${q.d}</span><b>${q.r?(ok?'朗讀清晰':'建議重讀'):(ok?'正確':ans[i]===null?'超時':'需重溫')}</b></summary>${detail}</details>`}).join('');
  app.innerHTML=`<section class="shell"><div class="card"><p class="eyebrow">測試完成</p><h1>${esc(name)} 的成績</h1><div class="score" style="--score:${pct*3.6}deg"><div><strong>${score}</strong><span>/ ${Q.length}</span></div></div><p class="message">${pct>=85?'整體表現穩定，可以改用正常面試速度。':pct>=65?'基礎良好，建議集中重做失分範疇。':'先使用清晰慢速，理解指令後再練限時。'}</p><div class="catgrid">${cg}</div><div class="review"><h2>答題檢視</h2>${reviews}</div><div class="actions"><button class="primary" id="again">換一套題</button><button class="secondary" id="home">返回首頁</button></div></div></section>`;
  document.getElementById('again').onclick=()=>{Q=buildSet();at=0;ans=[];heard=[];showQ()};
  document.getElementById('home').onclick=welcome;
}

if('speechSynthesis'in window){speechSynthesis.getVoices();speechSynthesis.onvoiceschanged=()=>speechSynthesis.getVoices()}
welcome();
  </script>
