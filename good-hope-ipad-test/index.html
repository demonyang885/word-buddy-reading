<!doctype html>
<html lang="zh-HK">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
  <meta name="theme-color" content="#0f6b5b">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <title>德望 iPad 模擬測試</title>
  <style>
    :root{--ink:#203a36;--muted:#62746f;--green:#0f6b5b;--dark:#084b40;--mint:#dff3ec;--cream:#f8f4ea;--line:#dce6e2;--danger:#c74a48}
    *{box-sizing:border-box}html{background:var(--cream)}body{margin:0;color:var(--ink);background:radial-gradient(circle at 8% 6%,rgba(213,168,63,.14),transparent 24rem),radial-gradient(circle at 90% 96%,rgba(15,107,91,.12),transparent 28rem),var(--cream);font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","PingFang HK","Noto Sans TC",sans-serif;-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent;overscroll-behavior:none}button,input{font:inherit}button{touch-action:manipulation}.shell{min-height:100svh;padding:max(28px,env(safe-area-inset-top)) max(24px,env(safe-area-inset-right)) max(28px,env(safe-area-inset-bottom)) max(24px,env(safe-area-inset-left));display:grid;place-items:center}.card{width:min(760px,100%);background:rgba(255,255,255,.96);border:1px solid rgba(32,58,54,.1);border-radius:32px;box-shadow:0 24px 80px rgba(32,58,54,.12);padding:clamp(28px,5vw,58px);text-align:center}.mark{width:72px;height:72px;margin:0 auto 18px;display:grid;place-items:center;color:#fff;background:var(--green);border:4px solid var(--mint);border-radius:50%;font:700 25px Georgia,serif;letter-spacing:.04em}.eyebrow{margin:0 0 10px;color:var(--green);font-size:12px;font-weight:800;letter-spacing:.16em}.card h1{margin:0;font-family:Georgia,"Times New Roman","Songti TC",serif;font-size:clamp(34px,6vw,52px);line-height:1.1;letter-spacing:-.03em}.intro{max-width:580px;margin:18px auto 28px;color:var(--muted);font-size:17px;line-height:1.7}.name{display:block;max-width:430px;margin:auto;text-align:left}.name span{display:block;margin:0 0 8px 4px;font-size:14px;font-weight:700}.name input{width:100%;height:58px;padding:0 18px;border:2px solid var(--line);border-radius:16px;color:var(--ink);background:#fff;font-size:20px;outline:none}.name input:focus{border-color:var(--green);box-shadow:0 0 0 4px var(--mint)}.facts{display:grid;grid-template-columns:repeat(3,1fr);max-width:480px;margin:26px auto;border:1px solid var(--line);border-radius:18px;overflow:hidden}.facts div{padding:15px 8px;background:#fbfdfc}.facts div+div{border-left:1px solid var(--line)}.facts strong{display:block;font-size:20px;color:var(--green)}.facts span{display:block;margin-top:4px;color:var(--muted);font-size:12px}.primary,.secondary,.sound{min-height:58px;border:0;border-radius:16px;padding:0 24px;font-weight:800;cursor:pointer}.primary{color:#fff;background:var(--green);box-shadow:0 10px 24px rgba(15,107,91,.2)}.primary:active{transform:translateY(1px);background:var(--dark)}.welcome .primary{width:min(430px,100%);font-size:19px}.sound{display:block;margin:10px auto 0;color:var(--green);background:transparent}.secondary{color:var(--green);background:var(--mint)}.history{max-width:430px;margin:24px auto 0;padding:18px;border-radius:18px;background:#f5faf8;text-align:left}.history-head,.history-row{display:flex;justify-content:space-between;align-items:center}.history-head h2{margin:0;font-size:14px}.history-head button{border:0;background:transparent;color:var(--muted);font-size:13px}.history-row{padding-top:12px;color:var(--muted);font-size:13px}.history-row strong{color:var(--ink);font-size:15px}
    .quiz{min-height:100svh;padding-bottom:max(20px,env(safe-area-inset-bottom));display:grid;grid-template-rows:auto 5px 1fr auto;background:#f9fbfa}.qhead{height:74px;padding:max(14px,env(safe-area-inset-top)) max(26px,env(safe-area-inset-right)) 12px max(26px,env(safe-area-inset-left));display:flex;align-items:center;justify-content:space-between;background:#fff}.qcount{color:var(--muted);font-size:15px;font-weight:700}.timer{min-width:72px;height:42px;padding:0 14px;display:flex;align-items:center;justify-content:center;gap:8px;border-radius:22px;color:var(--green);background:var(--mint);font-size:20px;font-weight:850;font-variant-numeric:tabular-nums}.timer.urgent{color:#fff;background:var(--danger);animation:pulse 1s infinite}@keyframes pulse{50%{transform:scale(1.04)}}.track{background:#e7eeeb;overflow:hidden}.track i{display:block;height:100%;background:linear-gradient(90deg,var(--green),#45a58c);transition:width .35s ease}.panel{width:min(940px,calc(100% - 48px));margin:auto;padding:clamp(24px,4vh,48px) 0;text-align:center}.pill{display:inline-flex;padding:7px 14px;color:var(--green);background:var(--mint);border-radius:999px;font-size:13px;font-weight:800}.instruction{margin:16px 0 4px;color:var(--muted);font-size:clamp(17px,2.4vw,21px)}.panel h1{margin:12px auto 24px;font-size:clamp(30px,5vw,48px);line-height:1.2;letter-spacing:-.025em}.audio{min-height:54px;margin:-2px 0 24px;padding:0 22px;border:2px solid var(--green);border-radius:999px;color:var(--green);background:#fff;font-weight:800}.choices{display:grid;grid-template-columns:repeat(2,1fr);gap:16px}.choices button{min-height:92px;padding:15px 22px;display:flex;align-items:center;gap:18px;border:2px solid var(--line);border-radius:20px;color:var(--ink);background:#fff;box-shadow:0 5px 16px rgba(32,58,54,.05);font-size:clamp(20px,3vw,27px);font-weight:700;text-align:left}.choices button:active:not(:disabled){border-color:var(--green);background:var(--mint);transform:scale(.99)}.choices button:disabled{opacity:.65}.letter{width:42px;height:42px;flex:0 0 42px;display:grid;place-items:center;border-radius:50%;color:var(--green);background:var(--mint);font-size:17px;font-weight:900}.choices.long button{min-height:98px;font-size:clamp(17px,2.6vw,22px)}.qfoot{min-height:60px;padding:8px max(26px,env(safe-area-inset-right)) 8px max(26px,env(safe-area-inset-left));display:flex;align-items:center;justify-content:space-between;color:var(--muted);background:#fff;border-top:1px solid var(--line);font-size:13px}.qfoot button{border:0;color:var(--muted);background:transparent;text-decoration:underline}
    .score{--score:0deg;width:164px;height:164px;margin:26px auto 18px;padding:13px;border-radius:50%;background:conic-gradient(var(--green) var(--score),var(--mint) 0)}.score>div{width:100%;height:100%;display:grid;place-content:center;border-radius:50%;background:#fff}.score strong{font-size:52px;line-height:.9}.score span{color:var(--muted);font-size:16px}.message{margin:0 auto 24px;color:var(--muted)}.catgrid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}.catgrid>div{padding:15px 12px;border-radius:14px;background:#f5faf8;text-align:left}.catgrid span{display:block;color:var(--muted);font-size:12px}.catgrid strong{display:block;margin:4px 0 9px;font-size:20px}.minibar{height:5px;border-radius:5px;background:var(--line);overflow:hidden}.minibar i{display:block;height:100%;border-radius:inherit;background:var(--green)}.review{margin-top:26px;text-align:left}.review h2{font-size:18px}.review details{margin-top:8px;padding:14px 16px;border:1px solid var(--line);border-radius:13px;background:#fff}.review summary{display:flex;justify-content:space-between;cursor:pointer;font-size:14px}.review summary b{color:var(--green)}.review .wrong summary b{color:var(--danger)}.review details p{margin:10px 0 0;color:var(--muted);font-size:13px}.actions{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:24px}
    @media(max-width:620px){.card{border-radius:24px}.choices{grid-template-columns:1fr;gap:11px}.choices button{min-height:72px}.panel{width:min(100% - 28px,940px);padding:22px 0}.catgrid{grid-template-columns:repeat(2,1fr)}}@media(orientation:landscape) and (max-height:720px){.qhead{height:60px}.panel{padding:16px 0}.instruction{margin-top:10px}.panel h1{margin:6px auto 14px;font-size:clamp(27px,4vw,38px)}.audio{min-height:44px;margin-bottom:14px}.choices button{min-height:68px}.choices.long button{min-height:76px}}@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
  </style>
</head>
<body><main id="app"></main>
<script>
const Q=[
{c:'中文',i:'按播放鍵，選出老師讀出的詞語',p:'請留心聆聽',o:['海羊','每洋','海洋','每羊'],a:2,s:22,v:['海洋','zh-HK'],n:'中文聆聽及字形辨識'},
{c:'中文',i:'找出有錯別字的句子',p:'哪一句寫錯了？',o:['今天的太陽很溫暖。','妹妹喜歡吃草莓。','我們在公園裏玩要。','小鳥在天空中飛翔。'],a:2,s:28,n:'中文閱讀及錯別字'},
{c:'英文',i:'Listen and choose the correct group.',p:'Tap the answer after listening.',o:['★  ○  □','○  ★  □','○  □  ★','□  ○  ★'],a:1,s:22,v:['Tap the group with a star between a circle and a square.','en-GB'],n:'英文指令及位置概念'},
{c:'英文',i:'Listen and choose the correct meaning.',p:'Where is the girl?',o:['女孩站在椅子前面','女孩站在椅子後面','女孩坐在椅子上','女孩站在椅子旁邊'],a:1,s:24,v:['The girl is standing behind the chair.','en-GB'],n:'英文句子理解'},
{c:'邏輯',i:'選出最長的一條線',p:'Which line is the longest?',o:['━━━━━━','━━━━━━━━━━','━━━━','━━━━━━━━'],a:1,s:18,n:'長短比較'},
{c:'邏輯',i:'選出最重的物件',p:'哪一樣最重？',o:['🍉 西瓜 3 kg','🍎 蘋果 200 g','🍌 香蕉 150 g','🍊 橙 180 g'],a:0,s:22,n:'重量及單位理解'},
{c:'數學',i:'選出正確答案',p:'8 + 6 = ?',o:['12','13','14','15'],a:2,s:18,n:'20以內加法'},
{c:'數學',i:'選出正確答案',p:'18 − 9 = ?',o:['7','8','9','10'],a:2,s:18,n:'20以內減法'},
{c:'數學',i:'🍎代表3，🍌代表5',p:'🍎 + 🍎 + 🍌 = ?',o:['8','10','11','13'],a:2,s:26,n:'等量代換'},
{c:'邏輯',i:'找出數字規律',p:'2，4，6，8，？',o:['9','10','11','12'],a:1,s:18,n:'規律及數列'},
{c:'數學',i:'選出單數',p:'Which number is odd?',o:['12','7','10','16'],a:1,s:18,n:'單雙數'},
{c:'英文',i:'Listen to the story and answer the question.',p:'Why did Mia share her umbrella?',o:['It was very sunny.','Her friend was getting wet.','She wanted a new umbrella.','She was going home alone.'],a:1,s:35,v:['Mia was walking to school when it started to rain. She saw her friend Lily without an umbrella. Mia smiled and invited Lily to walk under her umbrella. Why did Mia share her umbrella?','en-GB'],n:'英文故事理解'}
];
const app=document.getElementById('app');let name='Evelyn',at=0,left=Q[0].s,ans=[],locked=false,timer=null;
const esc=s=>String(s).replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
function say(t,l){if(!('speechSynthesis'in window))return;speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(t);u.lang=l;u.rate=l.startsWith('en')?.82:.78;const v=speechSynthesis.getVoices().find(x=>x.lang.toLowerCase().startsWith(l.slice(0,2).toLowerCase()));if(v)u.voice=v;speechSynthesis.speak(u)}
function hist(){try{return JSON.parse(localStorage.getItem('gh-attempts')||'[]')}catch(e){return[]}}
function welcome(){clearInterval(timer);const h=hist();app.innerHTML=`<section class="shell welcome"><div class="card"><div class="mark">GH</div><p class="eyebrow">2026 · P1 INTERVIEW PRACTICE</p><h1>德望 iPad 模擬測試</h1><p class="intro">12題限時測試，涵蓋中英文認讀、聆聽、20以內運算、比較及邏輯。測試期間不顯示答案。</p><label class="name"><span>小朋友姓名</span><input id="name" value="${esc(name)}" autocomplete="off"></label><div class="facts"><div><strong>12</strong><span>題目</span></div><div><strong>4–5</strong><span>分鐘</span></div><div><strong>20–35</strong><span>秒／題</span></div></div><button class="primary" id="start">開始模擬測試</button><button class="sound" id="sound">🔊 測試聲音</button>${h.length?`<div class="history"><div class="history-head"><h2>最近紀錄</h2><button id="clear">清除</button></div>${h.slice(0,3).map(x=>`<div class="history-row"><span>${esc(x.d)}</span><strong>${x.score}/${Q.length}</strong></div>`).join('')}</div>`:''}</div></section>`;document.getElementById('start').onclick=()=>{name=document.getElementById('name').value.trim()||'小朋友';at=0;ans=[];showQ()};document.getElementById('sound').onclick=()=>say('Sound check. 請留心聆聽。','zh-HK');if(h.length)document.getElementById('clear').onclick=()=>{localStorage.removeItem('gh-attempts');welcome()}}
function showQ(){clearInterval(timer);locked=false;left=Q[at].s;const q=Q[at],long=q.o.some(x=>x.length>15);app.innerHTML=`<section class="quiz"><header class="qhead"><div class="qcount">第 ${at+1} / ${Q.length} 題</div><div class="timer" id="timer">◷ <span>${left}</span></div></header><div class="track"><i style="width:${(at+1)/Q.length*100}%"></i></div><div class="panel"><div class="pill">${q.c}</div><p class="instruction">${esc(q.i)}</p><h1>${esc(q.p)}</h1>${q.v?'<button class="audio" id="audio">▶　再播放一次</button>':''}<div class="choices ${long?'long':''}">${q.o.map((x,i)=>`<button data-i="${i}"><span class="letter">${String.fromCharCode(65+i)}</span><span>${esc(x)}</span></button>`).join('')}</div></div><footer class="qfoot"><span>請選出一個答案</span><button id="skip">跳過此題</button></footer></section>`;document.querySelectorAll('.choices button').forEach(b=>b.onclick=()=>choose(Number(b.dataset.i)));document.getElementById('skip').onclick=()=>choose(null);if(q.v){document.getElementById('audio').onclick=()=>say(q.v[0],q.v[1]);setTimeout(()=>say(q.v[0],q.v[1]),450)}timer=setInterval(()=>{left--;document.querySelector('#timer span').textContent=left;if(left<=7)document.getElementById('timer').classList.add('urgent');if(left<=0){clearInterval(timer);choose(null)}},1000)}
function choose(v){if(locked)return;locked=true;clearInterval(timer);ans.push(v);document.querySelectorAll('button').forEach(b=>b.disabled=true);setTimeout(()=>{if(at===Q.length-1)result();else{at++;showQ()}},v===null?120:380)}
function result(){speechSynthesis&&speechSynthesis.cancel();const score=ans.reduce((n,x,i)=>n+(x===Q[i].a),0),pct=Math.round(score/Q.length*100),cats=['中文','英文','數學','邏輯'];let h=hist();h.unshift({d:new Date().toLocaleString('zh-HK',{hour12:false}),score});localStorage.setItem('gh-attempts',JSON.stringify(h.slice(0,5)));const cg=cats.map(c=>{const ii=Q.map((q,i)=>q.c===c?i:-1).filter(i=>i>=0),ok=ii.filter(i=>ans[i]===Q[i].a).length;return`<div><span>${c}</span><strong>${ok}/${ii.length}</strong><div class="minibar"><i style="width:${ok/ii.length*100}%"></i></div></div>`}).join('');app.innerHTML=`<section class="shell"><div class="card"><p class="eyebrow">測試完成</p><h1>${esc(name)} 的成績</h1><div class="score" style="--score:${pct*3.6}deg"><div><strong>${score}</strong><span>/ ${Q.length}</span></div></div><p class="message">${pct>=85?'整體表現穩定，可以加強限時及陌生題型。':pct>=65?'基礎良好，建議集中重做失分範疇。':'先放慢速度理解指令，再逐步加入倒計時。'}</p><div class="catgrid">${cg}</div><div class="review"><h2>答題檢視</h2>${Q.map((q,i)=>{const ok=ans[i]===q.a;return`<details class="${ok?'':'wrong'}"><summary><span>第${i+1}題 · ${q.c}</span><b>${ok?'正確':ans[i]===null?'超時':'需重溫'}</b></summary><p>${esc(q.n)}</p><p>正確答案：${esc(q.o[q.a])}</p>${!ok&&ans[i]!==null?`<p>作答：${esc(q.o[ans[i]])}</p>`:''}</details>`}).join('')}</div><div class="actions"><button class="primary" id="again">再測一次</button><button class="secondary" id="home">返回首頁</button></div></div></section>`;document.getElementById('again').onclick=()=>{at=0;ans=[];showQ()};document.getElementById('home').onclick=welcome}
welcome();
  </script>
</body>
</html>
